<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIG UŁAŃSKA 3.0 - OS BOOT</title>
    <style>
        :root {
            --theme-color: #00f3ff; /* Domyślny neonowy cyjan */
            --bg-color: #02060d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--theme-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Efekt linii skanującej CRT */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        .hud-container {
            position: relative;
            width: 90%;
            max-width: 700px;
            padding: 40px;
            background: rgba(2, 6, 13, 0.8);
            border: 1px solid var(--theme-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.05);
            backdrop-filter: blur(5px);
            z-index: 3;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        /* Narożniki w stylu Sci-Fi */
        .hud-container::before, .hud-container::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid var(--theme-color);
            transition: border-color 0.3s;
        }
        .hud-container::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .hud-container::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        h1 {
            font-size: 2rem;
            letter-spacing: 5px;
            margin-bottom: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--theme-color);
        }

        .sys-info {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
        }

        .terminal-box {
            height: 80px;
            font-size: 0.85rem;
            color: #a0a0a0;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .progress-wrapper {
            position: relative;
            width: 100%;
            height: 15px;
            border: 1px solid var(--theme-color);
            background: rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--theme-color);
            box-shadow: 0 0 15px var(--theme-color);
            transition: width 0.1s linear;
        }

        .bottom-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .percentage {
            font-size: 3.5rem;
            font-weight: bold;
            text-shadow: 0 0 15px var(--theme-color);
            line-height: 1;
        }

        .status-blinker {
            font-size: 1.2rem;
            animation: blink 1s infinite;
        }

        .countdown-box {
            font-size: 1.3rem;
            text-align: center;
            margin-top: 20px;
            letter-spacing: 3px;
            display: none;
            text-shadow: 0 0 10px var(--theme-color);
        }

        /* --- STANY ZATRZYMANIA / BŁĘDU --- */
        body.error-state {
            --theme-color: #ff003c; /* Zmiana na czerwień */
            background-image: 
                linear-gradient(rgba(255, 0, 60, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 60, 0.05) 1px, transparent 1px);
        }
        body.error-state .hud-container {
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.2), inset 0 0 20px rgba(255, 0, 60, 0.1);
        }
        body.error-state .status-blinker {
            animation: rapid-blink 0.3s infinite;
        }

        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        @keyframes rapid-blink { 0%, 49% { opacity: 1; text-shadow: 0 0 10px #ff003c; } 50%, 100% { opacity: 0; } }
        @keyframes flicker { 0% { opacity: 0.1; } 50% { opacity: 0.2; } 100% { opacity: 0.1; } }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .percentage { font-size: 2.5rem; }
            .sys-info { flex-direction: column; }
            .countdown-box { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <h1>WIG_UŁAŃSKA_v3.0</h1>
        <div class="sys-info">
            <span>SYS.BOOT_SEQ // INIT</span>
            <span>MEM: ALLOCATING...</span>
        </div>

        <div class="terminal-box" id="terminal">
            <div>> Uruchamianie protokołów podstawowych...</div>
        </div>

        <div class="progress-wrapper">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="bottom-hud">
            <div class="status-blinker" id="statusText">ŁADOWANIE DANYCH_</div>
            <div class="percentage" id="percentageText">00%</div>
        </div>

        <!-- Kontener na odliczanie -->
        <div class="countdown-box" id="countdownBox">
            ETA // WYLICZANIE...
        </div>
    </div>

    <script>
        // Zmiana progu zatrzymania na 90%
        const targetProgress = 90;
        let currentProgress = 0;
        
        const progressBar = document.getElementById('progressBar');
        const percentageText = document.getElementById('percentageText');
        const terminal = document.getElementById('terminal');
        const statusText = document.getElementById('statusText');
        const countdownBox = document.getElementById('countdownBox');
        const body = document.body;

        const bootLogs = [
            "> Ładowanie modułów CSS/JS...",
            "> Dekryptowanie bazy danych...",
            "> Łączenie z serwerem głównym...",
            "> Weryfikacja certyfikatów bezpieczeństwa...",
            "> Optymalizacja zasobów wizualnych...",
            "> Budowanie interfejsu użytkownika...",
            "> Kalibracja systemów podtrzymywania...",
            "> Synchronizacja węzłów sieciowych..."
        ];

        let logIndex = 0;

        function addLog(text) {
            const newLog = document.createElement('div');
            newLog.textContent = text;
            terminal.appendChild(newLog);
            if(terminal.children.length > 4) {
                terminal.removeChild(terminal.firstChild);
            }
        }

        // Funkcja obsługująca odliczanie
        function startCountdown() {
            // Data docelowa: 14.10.2026 14:00:00
            const countDownDate = new Date("Oct 14, 2026 14:00:00").getTime();

            const updateTimer = setInterval(() => {
                const now = new Date().getTime();
                const distance = countDownDate - now;

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                const format = (num) => num < 10 ? '0' + num : num;

                if (distance < 0) {
                    clearInterval(updateTimer);
                    countdownBox.innerHTML = "SYSTEM ODBLOKOWANY // PROSZĘ ODŚWIEŻYĆ";
                } else {
                    countdownBox.innerHTML = `ETA // ${format(days)}D : ${format(hours)}H : ${format(minutes)}M : ${format(seconds)}S`;
                }
            }, 1000);
        }

        // Główna pętla ładowania
        const loadingInterval = setInterval(() => {
            currentProgress++;
            
            let displayPercent = currentProgress < 10 ? '0' + currentProgress : currentProgress;
            
            progressBar.style.width = currentProgress + '%';
            percentageText.textContent = displayPercent + '%';

            if (currentProgress % 10 === 0 && logIndex < bootLogs.length) {
                addLog(bootLogs[logIndex]);
                logIndex++;
            }

            // CRITICAL STOP w 90%
            if (currentProgress >= targetProgress) {
                clearInterval(loadingInterval);
                
                setTimeout(() => {
                    body.classList.add('error-state');
                    
                    addLog("> [FATAL ERROR] Dostęp zablokowany.");
                    addLog("> Oczekiwanie na premierę systemu...");
                    statusText.textContent = "SYSTEM_LOCKED // ODLICZANIE";
                    
                    document.querySelector('.sys-info').innerHTML = 
                        '<span style="color: #ff003c;">ERR: DEV_LOCK</span><span>DOSTĘP ODRZUCONY</span>';
                    
                    // Pokazanie i uruchomienie odliczania
                    countdownBox.style.display = 'block';
                    startCountdown();

                }, 300);
            }
        }, 80);
    </script>

</body>
</html>
